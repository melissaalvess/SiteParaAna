<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Correspondência Especial</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
:root{
   --primary:#E63946;
   --primary-light:#FFB4A2;
   --offwhite:#FAF7F2;
   --paper:#FFFDF9;
   --text:#3B3B3B;
}
body{
   /*min-height:100vh;*/
   background:
       radial-gradient(circle at top left,
       rgba(230,57,70,.08),
       transparent 30%),
       radial-gradient(circle at bottom right,
       rgba(255,180,162,.15),
       transparent 35%),
       var(--offwhite);
   display:flex;
   justify-content:center;
   align-items:center;
   padding:20px;
   font-family:
   "Inter",
   "Segoe UI",
   sans-serif;
}
.main-card{
   width:100%;
   max-width:900px;
   background:var(--paper);
   border-radius:32px;
   padding:60px;
   box-shadow:
       0 25px 50px rgba(0,0,0,.08);
   position:relative;
   overflow-x:hidden;
   overflow-y: auto;
}
.stamp{
   position:absolute;
   top:25px;
   right:25px;
   width:90px;
   height:90px;
   border:3px dashed rgba(230,57,70,.3);
   border-radius:20px;
   display:flex;
   justify-content:center;
   align-items:center;
   color:var(--primary);
   font-size:2rem;
   transform:rotate(12deg);
}
.letter-icon{
   font-size:5rem;
   transition:.4s;
   cursor:pointer;
}
.letter-icon:hover{
   transform:
       translateY(-8px)
       rotate(-4deg);
}
h1{
   color:var(--primary);
   font-weight:800;
   margin-top:20px;
}
.subtitle{
   color:#777;
   max-width:500px;
   margin:auto;
}
.option-card{
   background:white;
   border:none;
   border-radius:22px;
   padding:20px;
   transition:.3s;
   cursor:pointer;
   box-shadow:
       0 10px 20px rgba(0,0,0,.04);
   height:100%;
}
.option-card:hover{
   transform:
       translateY(-6px);
   box-shadow:
       0 15px 35px rgba(230,57,70,.12);
   border:1px solid rgba(230,57,70,.15);
}
.option-card:active{
   transform:scale(.97);
}
.option-icon{
   font-size:2rem;
}
.option-title{
   margin-top:10px;
   font-weight:600;
}
.result-box{
   margin-top:35px;
   min-height:80px;
   display:flex;
   justify-content:center;
   align-items:center;
   color:var(--primary);
   font-weight:600;
}
.continue-btn{
   display:none;
}
.btn-love{
   background:var(--primary);
   border:none;
   padding:14px 28px;
   border-radius:16px;
   font-weight:600;
   transition:.3s;
   box-shadow:
       0 10px 25px rgba(230,57,70,.2);
}
.btn-love:hover{
   background:#d62839;
   transform:translateY(-3px);
   box-shadow:
       0 15px 35px rgba(230,57,70,.35);
}
.btn-love:active{
   transform:scale(.96);
}
.fade-in{
   animation:fade .5s ease;
}
@keyframes fade{
   from{
       opacity:0;
       transform:translateY(15px);
   }
   to{
       opacity:1;
       transform:translateY(0);
   }
}
</style>
</head>
<body>
<div class="main-card text-center">
<div class="stamp">
       💌
</div>
<div class="letter-icon">
       📨
</div>
<h1>Presente Especial</h1>
<p class="subtitle mt-3">
       Encontramos uma carta que deveria ser entregue
       apenas para uma pessoa específica.
</p>
<div class="row mt-5 g-4">
<div class="col-md-3">
<div class="option-card" onclick="errado()">
<div class="option-icon">📮</div>
<div class="option-title">Carteira</div>
</div>
</div>
<div class="col-md-3">
<div class="option-card" onclick="errado()">
<div class="option-icon">🕵️</div>
<div class="option-title">Espiã</div>
</div>
</div>
<div class="col-md-3">
<div class="option-card" onclick="correto()">
<div class="option-icon">💌</div>
<div class="option-title">Ana Luiza</div>
</div>
</div>
<div class="col-md-3">
<div class="option-card" onclick="errado()">
<div class="option-icon">📋</div>
<div class="option-title">Fiscal</div>
</div>
</div>
</div>
<div class="result-box" id="resultado">
</div>
<div id="continueBtn" class="continue-btn">
<a href="carta.html" class="btn btn-love text-white">
           Abrir Correspondência 
</a>
</div>
</div>
<script>
function errado(){
   document.getElementById("resultado").innerHTML = `
<div class="fade-in">
           Destinatário incompatível. A correspondência permanece lacrada.
</div>
   `;
   document.getElementById("continueBtn").style.display = "none";
}
function correto(){
   document.getElementById("resultado").innerHTML = `
<div class="fade-in">
           ✓ Destinatária localizada. Entrega autorizada.
</div>
   `;
   document.getElementById("continueBtn").style.display = "block";
}
</script>
</body>
</html>
