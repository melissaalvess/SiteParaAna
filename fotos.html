<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Anexos Fotográficos</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

:root{
    --primary:#E63946;
    --primary-dark:#D62839;
    --offwhite:#FAF7F2;
    --paper:#FFFDF9;
}

body{

    background:
    radial-gradient(circle at top left,
    rgba(230,57,70,.08),
    transparent 35%),

    radial-gradient(circle at bottom right,
    rgba(255,180,162,.15),
    transparent 40%),

    var(--offwhite);

    min-height:100vh;

    padding:25px 15px;

    font-family:
    "Segoe UI",
    sans-serif;
}

.header{

    text-align:center;

    margin-bottom:25px;
}

.header h1{

    color:var(--primary);

    font-weight:800;
}

.header p{

    color:#777;
}

.carousel-card{

    background:var(--paper);

    border-radius:28px;

    overflow:hidden;

    box-shadow:
    0 20px 40px rgba(0,0,0,.08);

    max-width:800px;

    margin:auto;
}

.photo-container{

    height:65vh;

    display:flex;

    justify-content:center;

    align-items:center;

    background:#f7f7f7;
}

.photo-container img{

    width:100%;

    height:100%;

    object-fit:contain;
}

.caption{

    padding:20px;

    text-align:center;
}

.caption h5{

    color:var(--primary);

    font-weight:700;
}

.caption p{

    margin-bottom:0;

    color:#666;
}

.carousel-control-prev-icon,
.carousel-control-next-icon{

    background-color:rgba(0,0,0,.55);

    border-radius:50%;

    padding:20px;
}

.counter{

    text-align:center;

    margin-top:15px;

    color:#777;
}

.bottom-buttons{

    display:flex;

    justify-content:center;

    gap:15px;

    flex-wrap:wrap;

    margin-top:30px;
}

.btn-custom{

    background:var(--primary);

    color:white;

    text-decoration:none;

    padding:12px 22px;

    border-radius:15px;

    transition:.3s;

    box-shadow:
    0 10px 25px rgba(230,57,70,.2);
}

.btn-custom:hover{

    color:white;

    background:var(--primary-dark);

    transform:translateY(-3px);
}

</style>

</head>

<body>

<div class="container">

    <div class="header">

        <h1>📎 Nossas memórias </h1>

        <p>
            Algumas lembranças de dias que não eram especiais, mas se tornaram
        </p>

    </div>

    <div class="carousel-card">

        <div id="albumCarousel"
             class="carousel slide"
             data-bs-ride="false">

            <div class="carousel-inner"
                 id="carouselInner">
            </div>

            <button class="carousel-control-prev"
                    type="button"
                    data-bs-target="#albumCarousel"
                    data-bs-slide="prev">

                <span class="carousel-control-prev-icon"></span>

            </button>

            <button class="carousel-control-next"
                    type="button"
                    data-bs-target="#albumCarousel"
                    data-bs-slide="next">

                <span class="carousel-control-next-icon"></span>

            </button>

        </div>

    </div>

    <div class="counter">
        23 memórias...
    </div>

    <div class="bottom-buttons">

        <a href="carta.html"
           class="btn-custom">

            💌 Voltar para a carta

        </a>

        <a href="index.html"
           class="btn-custom">

            🏠 Página inicial

        </a>

    </div>

</div>

<script>

const fotos = [

"IMG-20251002-WA0048.jpg",
"IMG-20251018-WA0028.jpg",
"IMG-20251114-WA0072.jpg",
"IMG-20251115-WA0020.jpg",
"IMG-20251121-WA0080.jpg",
"IMG-20251121-WA0082.jpg",
"IMG-20251202-WA0049.jpg",
"IMG-20251208-WA0031.jpg",
"IMG-20251212-WA0142.jpg",
"IMG-20251217-WA0015.jpg",
"IMG-20260102-WA0026.jpg",
"IMG-20260203-WA0206.jpg",
"IMG-20260203-WA0453.jpg",
"IMG-20260208-WA0004.jpg",
"IMG-20260309-WA0139.jpg",
"IMG-20260316-WA0035.jpg",
"IMG-20260316-WA0040.jpg",
"IMG-20260415-WA0025.jpg",
"IMG-20260602-WA0020.jpg",
"IMG-20260602-WA0025.jpg",
"IMG-20260606-WA0148.jpg",
"IMG-20260610-WA0013.jpg",
"Screenshot_20251117-002853.png"

];

const carousel =
document.getElementById("carouselInner");

fotos.forEach((foto,index)=>{

carousel.innerHTML += `

<div class="carousel-item ${index === 0 ? 'active' : ''}">

    <div class="photo-container">

        <img
            src="${foto}"
            alt="Foto ${index+1}">

    </div>

    <div class="caption">

        <h5>
            Anexo ${String(index+1).padStart(2,'0')} ❤️
        </h5>

        <p>
            Uma lembrança especial.
        </p>

    </div>

</div>

`;

});

</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
