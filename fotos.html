
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Anexos Fotográficos</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

:root{
    --primary:#E63946;
    --offwhite:#FAF7F2;
    --paper:#FFFDF9;
}

body{

    background:
    radial-gradient(circle at top left,
    rgba(230,57,70,.08),
    transparent 35%),

    radial-gradient(circle at bottom right,
    rgba(255,180,162,.15),
    transparent 40%),

    var(--offwhite);

    min-height:100vh;

    padding:30px 15px;

    font-family:
    "Segoe UI",
    sans-serif;
}

.header{

    text-align:center;

    margin-bottom:30px;
}

.header h1{

    color:var(--primary);

    font-weight:800;
}

.header p{

    color:#777;
}

.carousel-card{

    background:var(--paper);

    border-radius:28px;

    overflow:hidden;

    box-shadow:
    0 20px 40px rgba(0,0,0,.08);

    max-width:700px;

    margin:auto;
}

.photo-container{

    height:500px;

    background:#f4f4f4;

    display:flex;

    align-items:center;

    justify-content:center;
}

.photo-container img{

    width:100%;
    height:100%;

    object-fit:contain;
}

.caption{

    padding:25px;
    text-align:center;
}

.caption h5{

    color:var(--primary);

    font-weight:700;
}

.caption p{

    color:#666;

    margin-bottom:0;
}

.carousel-control-prev-icon,
.carousel-control-next-icon{

    background-color:rgba(0,0,0,.5);

    border-radius:50%;

    padding:20px;
}

.bottom-buttons{

    margin-top:35px;

    display:flex;

    justify-content:center;

    gap:15px;

    flex-wrap:wrap;
}

.btn-custom{

    background:var(--primary);

    color:white;

    border:none;

    border-radius:14px;

    padding:12px 20px;

    text-decoration:none;

    transition:.3s;
}

.btn-custom:hover{

    background:#d62839;

    color:white;

    transform:translateY(-3px);
}

.counter{

    text-align:center;

    margin-top:15px;

    color:#888;
}

</style>
</head>
<body>

<div class="container">

    <div class="header">

        <h1>📎 Anexos Fotográficos</h1>

        <p>
            Algumas lembranças que eu gosto de guardar.
        </p>

    </div>

    <div class="carousel-card">

        <div id="albumCarousel"
             class="carousel slide"
             data-bs-ride="false">

            <div class="carousel-inner">

                <!-- FOTO 01 -->
                <div class="carousel-item active">

                    <div class="photo-container">
                        <img src="img/foto01.jpg">
                    </div>

                    <div class="caption">
                        <h5>Anexo 01 ❤️</h5>
                        <p>Sua legenda aqui.</p>
                    </div>

                </div>

                <!-- FOTO 02 -->
                <div class="carousel-item">

                    <div class="photo-container">
                        <img src="img/foto02.jpg">
                    </div>

                    <div class="caption">
                        <h5>Anexo 02 ❤️</h5>
                        <p>Sua legenda aqui.</p>
                    </div>

                </div>

                <!-- FOTO 03 -->
                <div class="carousel-item">

                    <div class="photo-container">
                        <img src="img/foto03.jpg">
                    </div>

                    <div class="caption">
                        <h5>Anexo 03 ❤️</h5>
                        <p>Sua legenda aqui.</p>
                    </div>

                </div>

                <!-- FOTO 04 -->
                <div class="carousel-item">

                    <div class="photo-container">
                        <img src="img/foto04.jpg">
                    </div>

                    <div class="caption">
                        <h5>Anexo 04 ❤️</h5>
                        <p>Sua legenda aqui.</p>
                    </div>

                </div>

                <!-- FOTO 05 -->
                <div class="carousel-item">

                    <div class="photo-container">
                        <img src="img/foto05.jpg">
                    </div>

                    <div class="caption">
                        <h5>Anexo 05 ❤️</h5>
                        <p>Sua legenda aqui.</p>
                    </div>

                </div>

                <!-- CONTINUE ATÉ FOTO 23 -->

            </div>

            <button class="carousel-control-prev"
                    type="button"
                    data-bs-target="#albumCarousel"
                    data-bs-slide="prev">

                <span class="carousel-control-prev-icon"></span>

            </button>

            <button class="carousel-control-next"
                    type="button"
                    data-bs-target="#albumCarousel"
                    data-bs-slide="next">

                <span class="carousel-control-next-icon"></span>

            </button>

        </div>

    </div>

    <div class="counter">
        23 memórias...
    </div>

    <div class="bottom-buttons">

        <a href="carta.html" class="btn-custom">
            Carta
        </a>

        <a href="index.html" class="btn-custom">
          Voltar
        </a>


    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
